<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vee Cartoon Studio - AI Cartoon Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --yellow: #f59e0b;
            --dark: #0f172a;
            --dark-card: #1e293b;
            --light: #f8fafc;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', sans-serif; }
        body { background: var(--dark); color: var(--light); min-height: 100vh; display: flex; flex-direction: column; }

        nav {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #334155;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: var(--secondary); display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent); }
        
        .btn {
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-accent { background: var(--accent); color: var(--dark); }
        .btn-dark { background: #334155; color: white; }

        .container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; }

        .hero {
            text-align: center;
            padding: 25px 10px;
            background: radial-gradient(circle at center, #2e1065 0%, var(--dark) 70%);
            border-radius: 24px;
            margin-bottom: 20px;
            border: 2px solid #4c1d95;
        }
        .hero h1 { font-family: 'Fredoka One', cursive; font-size: 2.2rem; color: var(--yellow); margin-bottom: 8px; }
        .hero p { color: #cbd5e1; font-size: 0.95rem; }

        .studio-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 850px) {
            .studio-grid { grid-template-columns: 380px 1fr; }
        }

        .panel {
            background: var(--dark-card);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel h3 { font-family: 'Fredoka One', cursive; color: var(--accent); font-size: 1.2rem; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
        textarea { resize: vertical; min-height: 90px; }

        .stage-area {
            background: #020617;
            border-radius: 24px;
            border: 2px solid #334155;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 420px;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 3px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cartoonImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--yellow);
            font-weight: bold;
            gap: 10px;
            padding: 20px;
            text-align: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #334155;
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .speech-bubble {
            margin-top: 15px;
            width: 100%;
            max-width: 380px;
            background: white;
            color: #0f172a;
            padding: 12px 18px;
            border-radius: 16px;
            font-weight: 700;
            text-align: center;
            border: 2px solid #0f172a;
            font-size: 0.95rem;
        }

        .stage-controls { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }

        footer { text-align: center; padding: 20px; color: #64748b; font-size: 0.85rem; border-top: 1px solid #1e293b; margin-top: 20px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🎨 Vee <span>Cartoon Studio</span></div>
        <button class="btn btn-accent" id="voiceBtn">🔊 Speak Script</button>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>AI Cartoon Generator</h1>
            <p>Type your idea below and watch AI turn it into a real cartoon!</p>
        </div>

        <div class="studio-grid">
            <div class="panel">
                <h3>Cartoon Prompt & Style</h3>
                <div class="form-group">
                    <label>What cartoon do you want to create?</label>
                    <textarea id="promptInput" placeholder="A cute baby dragon wearing a red superhero cape, 3d pixar style, colorful background..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>Cartoon Art Style</label>
                    <select id="styleSelect">
                        <option value="3d animation render, disney pixar style">3D Animated Movie (Pixar Style)</option>
                        <option value="2d vector cartoon, vibrant vibrant colors, sharp outline">Classic 2D Vector Cartoon</option>
                        <option value="anime style, studio ghibli, detailed art">Anime / Manga Style</option>
                        <option value="comic book style, pop art, bold lines">Comic Book Style</option>
                        <option value="children storybook illustration, soft pastel colors">Children's Book Illustration</option>
                    </select>
                </div>

                <button class="btn btn-primary" id="generateBtn">✨ Generate AI Cartoon</button>
            </div>

            <div class="stage-area">
                <div class="image-wrapper">
                    <img id="cartoonImage" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=60" alt="Cartoon Result">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                        <span id="loadingText">Generating your AI Cartoon... Please wait 5-10 seconds!</span>
                    </div>
                </div>

                <div class="speech-bubble" id="speechBubble">
                    Your cartoon dialogue/description will show here!
                </div>

                <div class="stage-controls">
                    <button class="btn btn-dark" id="downloadBtn">📥 Download Cartoon Image</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        Vee Cartoon Studio © 2026 | Powered by AI Image Synthesis
    </footer>

    <script>
        const promptInput = document.getElementById('promptInput');
        const styleSelect = document.getElementById('styleSelect');
        const generateBtn = document.getElementById('generateBtn');
        const cartoonImage = document.getElementById('cartoonImage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const speechBubble = document.getElementById('speechBubble');
        const voiceBtn = document.getElementById('voiceBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        // Free AI Image Generation API call (Pollination AI Endpoint)
        async function generateCartoonImage() {
            const userPrompt = promptInput.value.trim();
            if (!userPrompt) {
                alert('Please type a cartoon prompt first!');
                return;
            }

            const fullPrompt = encodeURIComponent(`${userPrompt}, ${styleSelect.value}`);
            const seed = Math.floor(Math.random() * 999999);
            // Public high-speed free AI inference URL
            const aiImageUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=512&height=512&seed=${seed}&nologo=true`;

            // Show loading overlay
            loadingOverlay.style.display = 'flex';
            speechBubble.textContent = userPrompt;

            // Preload Image
            const img = new Image();
            img.onload = () => {
                cartoonImage.src = aiImageUrl;
                loadingOverlay.style.display = 'none';
            };
            img.onerror = () => {
                loadingOverlay.style.display = 'none';
                alert('Image generation took too long or failed. Please try again!');
            };
            img.src = aiImageUrl;
        }

        generateBtn.addEventListener('click', generateCartoonImage);

        // Text To Speech
        voiceBtn.addEventListener('click', () => {
            const text = speechBubble.textContent;
            if ('speechSynthesis' in window && text) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utter);
            }
        });

        // Download Image
        downloadBtn.addEventListener('click', async () => {
            try {
                const response = await fetch(cartoonImage.src);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'vee-cartoon.jpg';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (e) {
                window.open(cartoonImage.src, '_blank');
            }
        });
    </script>
</body>
</html>
