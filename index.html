<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vee Toon Studio Pro - Cartoon Video Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,700;1,700&family=Fredoka:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-comic { font-family: 'Bangers', cursive; tracking: 1px; }
    .font-bubble { font-family: 'Fredoka', sans-serif; }
    .font-hand { font-family: 'Comic Neue', cursive; }
    
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Canvas Grid & Shadow Effects */
    .canvas-bg-pattern {
      background-image: radial-gradient(#334155 1px, transparent 1px);
      background-size: 16px 16px;
    }
    
    .cartoon-shadow {
      box-shadow: 0 8px 0px #020617, 0 12px 20px rgba(0,0,0,0.5);
    }
    
    .btn-cartoon {
      transition: all 0.1s ease;
      box-shadow: 0 4px 0 #020617;
    }
    .btn-cartoon:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #020617;
    }

    /* Pulse Glow Animation */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6)); }
      50% { filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.9)); }
    }
    .glow-active {
      animation: pulseGlow 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-x-hidden antialiased select-none">

  <header class="h-16 bg-slate-900 border-b-4 border-slate-800 flex items-center justify-between px-4 sm:px-6 shrink-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-400 to-yellow-300 border-2 border-slate-950 flex items-center justify-center text-slate-950 font-bold text-xl shadow-md rotate-[-3deg]">
        <i class="fa-solid fa-face-laugh-squint"></i>
      </div>
      <div>
        <h1 class="font-comic text-2xl tracking-wide bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 bg-clip-text text-transparent leading-none">
          VEE TOON STUDIO PRO
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">Cartoon Video Generator & Exporter</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Aspect Ratio Switcher -->
      <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center">
        <button id="ratio-9-16" onclick="setAspectRatio('9:16')" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition">
          <i class="fa-solid fa-mobile-screen mr-1"></i>9:16
        </button>
        <button id="ratio-16-9" onclick="setAspectRatio('16:9')" class="px-2.5 py-1 text-xs font-bold rounded-lg hover:bg-slate-800 text-slate-400 transition">
          <i class="fa-solid fa-desktop mr-1"></i>16:9
        </button>
      </div>

      <!-- Main Render & Export Modal Trigger -->
      <button onclick="openExportModal()" class="px-4 py-2 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-extrabold text-xs sm:text-sm rounded-xl border-2 border-slate-950 btn-cartoon flex items-center gap-2 glow-active">
        <i class="fa-solid fa-film text-base"></i>
        <span>EXPORT VIDEO</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
    
    <!-- LEFT PANEL: Controls, Scripts & Settings -->
    <div class="w-full lg:w-96 bg-slate-900 border-r-0 lg:border-r-4 border-slate-800 flex flex-col shrink-0 overflow-y-auto max-h-[50vh] lg:max-h-none border-b-4 lg:border-b-0 z-20">
      
      <!-- Panel Header Tabs -->
      <div class="flex border-b border-slate-800 bg-slate-950/60 p-1">
        <button onclick="switchTab('script')" id="tab-btn-script" class="flex-1 py-2 text-xs font-bold text-amber-400 bg-slate-900 rounded-lg border border-slate-800 transition">
          <i class="fa-solid fa-pen-nib mr-1"></i> Script
        </button>
        <button onclick="switchTab('character')" id="tab-btn-character" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition">
          <i class="fa-solid fa-mask mr-1"></i> Avatar
        </button>
        <button onclick="switchTab('scene')" id="tab-btn-scene" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition">
          <i class="fa-solid fa-mountain-sun mr-1"></i> Scene
        </button>
        <button onclick="switchTab('audio')" id="tab-btn-audio" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition">
          <i class="fa-solid fa-music mr-1"></i> Sound
        </button>
      </div>

      <!-- TAB 1: SCRIPT & JOKES -->
      <div id="panel-script" class="p-4 space-y-4">
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> Quick Joke Presets

          <div class="grid grid-cols-2 gap-2">
            <button onclick="loadPresetScript('banana')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition group">

              <div class="text-[10px] text-slate-500">Silly grocery joke</div>

            <button onclick="loadPresetScript('alien')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition group">
              <div class="text-xs font-bold text-purple-400 group-hover:translate-x-1 transition-transform">🛸 Alien Visit</div>
              <div class="text-[10px] text-slate-500">Space encounter</div>
            </button>
            <button onclick="loadPresetScript('homework')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition group">
              <div class="text-xs font-bold text-emerald-400 group-hover:translate-x-1 transition-transform">🐶 Homework Excuse</div>
              <div class="text-[10px] text-slate-500">Funny school excuse</div>

            <button onclick="loadPresetScript('laser')" class="p-2 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-left transition group">

        <div>

            <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Cartoon Dialogue Lines</label>
            <span class="text-[10px] text-slate-500">1 line = 1 spoken bubble</span>

One line per dialogue bubble!"></textarea>

          <button onclick="selectCharacter('cat')" id="char-btn-cat" class="p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl flex flex-col items-center gap-2 hover:border-amber-400 transition text-center">

            <span class="text-xs font-bold text-slate-300">Chester Cat</span>
          </button>

          <button onclick="selectCharacter('alien')" id="char-btn-alien" class="p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl flex flex-col items-center gap-2 hover:border-amber-400 transition text-center">

          <button onclick="selectCharacter('kid')" id="char-btn-kid" class="p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl flex flex-col items-center gap-2 hover:border-amber-400 transition text-center">

            <span class="text-xs font-bold text-slate-300">Comic Hero Kid</span>

        <div>

          <select id="character-mood" onchange="updateCharacterMood()" class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 font-bold focus:outline-none">

      </div>

      <!-- TAB 3: SCENE BACKGROUNDS -->
      <div id="panel-scene" class="p-4 space-y-4 hidden">

        <div class="grid grid-cols-1 gap-2">

            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-sky-400 flex items-center justify-center text-lg">🌳</div>
            <div>
              <div class="text-xs font-bold text-amber-400">Sunny Park Hill</div>
              <div class="text-[10px] text-slate-500">Green hills, floating clouds & sun</div>
            </div>
          </button>

          <button onclick="setScene('space')" id="scene-btn-space" class="p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl flex items-center gap-3 text-left transition">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-900 to-indigo-950 flex items-center justify-center text-lg">🌌</div>

          </button>

          <button onclick="setScene('candy')" id="scene-btn-candy" class="p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl flex items-center gap-3 text-left transition">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-lg">🍭</div>
            <div>
              <div class="text-xs font-bold text-slate-200">Candy Land</div>
              <div class="text-[10px] text-slate-500">Sweet pink sky & colorful lollipops</div>

          </button>

          <button onclick="setScene('comic')" id="scene-btn-comic" class="p-3 bg-slate-950 border-2 border-slate-800 rounded-2xl flex items-center gap-3 text-left transition">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-400 to-red-500 flex items-center justify-center text-lg">💥</div>
            <div>
              <div class="text-xs font-bold text-slate-200">Comic Pop Art</div>
              <div class="text-[10px] text-slate-500">Sunburst action rays grid</div>
            </div>
          </button>
        </div>
      </div>

      <!-- TAB 4: AUDIO & SOUND FX -->
      <div id="panel-audio" class="p-4 space-y-4 hidden">
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Background Music Synth</label>
          <select id="audio-theme" class="w-full bg-slate-950 border-2 border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 font-bold focus:outline-none">
            <option value="bouncy">🎵 Cheerful Bouncy Melody</option>
            <option value="quirky">🎪 Quirky Circus Tune</option>
            <option value="space">🚀 Retro Sci-Fi Beeps</option>
            <option value="none">🔇 Mute Background Music</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-1.5">Test Cartoon Sound FX</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="playSFX('boing')" class="p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-xs font-bold text-amber-400 flex items-center justify-center gap-2">
              <i class="fa-solid fa-bounce"></i> Boing!
            </button>
            <button onclick="playSFX('pop')" class="p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-xs font-bold text-cyan-400 flex items-center justify-center gap-2">
              <i class="fa-solid fa-burst"></i> Pop!

            <button onclick="playSFX('laugh')" class="p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-xs font-bold text-emerald-400 flex items-center justify-center gap-2">

            <button onclick="playSFX('whistle')" class="p-2.5 bg-slate-950 hover:bg-slate-800 rounded-xl border border-slate-800 text-xs font-bold text-purple-400 flex items-center justify-center gap-2">

    </div>

    <!-- RIGHT PANEL: Canvas Studio & Live Animation Stage -->
    <div class="flex-1 bg-slate-950 flex flex-col justify-between relative overflow-hidden p-4 sm:p-6 canvas-bg-pattern">
      
      <!-- Stage Preview Container -->
      <div class="flex-1 flex items-center justify-center relative min-h-[350px]">
        
        <div id="canvas-wrapper" class="relative rounded-2xl overflow-hidden border-4 border-slate-900 cartoon-shadow transition-all duration-300">
          <canvas id="toon-canvas" class="w-full h-full block bg-sky-300"></canvas>
        </div>

      </div>

      <div class="mt-4 bg-slate-900/90 border-2 border-slate-800 backdrop-blur-md rounded-2xl p-3 flex items-center justify-between gap-4 shrink-0 max-w-xl mx-auto w-full z-20">
        
        <div class="flex items-center gap-3">
          <button id="play-btn" onclick="togglePlayPause()" class="w-12 h-12 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xl flex items-center justify-center border-2 border-slate-950 btn-cartoon">
            <i class="fa-solid fa-play" id="play-icon"></i>

          <button onclick="resetPlayback()" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center border border-slate-700">

  <div id="export-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border-4 border-slate-800 rounded-3xl w-full max-w-md p-6 cartoon-shadow space-y-5">
      
      <div class="flex items-center justify-between border-b-2 border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-amber-400 flex items-center justify-center text-slate-950 font-bold">
            <i class="fa-solid fa-download"></i>
          </div>
          <h3 class="font-comic text-xl text-amber-400 tracking-wide">EXPORT CARTOON VIDEO</h3>
        </div>
        <button onclick="closeExportModal()" class="text-slate-500 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-400 block mb-1">Video Resolution</label>

            <option value="1080p">1080p Full HD (Crisp Quality)</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-400 block mb-1">Export Format</label>
          <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl flex items-center justify-between text-xs font-bold text-amber-400">
            <span><i class="fa-solid fa-file-video mr-2"></i>WebM High Quality Video</span>
            <span class="text-[10px] bg-amber-400/10 text-amber-400 px-2 py-0.5 rounded border border-amber-400/20">Supported</span>
          </div>
        </div>

        <!-- Render Progress Tracker -->
        <div id="export-progress-box" class="hidden space-y-2 pt-2">
          <div class="flex justify-between text-xs font-bold">
            <span id="export-status-text" class="text-amber-400 animate-pulse">Rendering Cartoon Animation...</span>
            <span id="export-percentage" class="text-slate-300">0%</span>
          </div>
          <div class="w-full bg-slate-950 h-3 rounded-full overflow-hidden border border-slate-800">
            <div id="export-progress-bar" class="bg-gradient-to-r from-amber-400 to-orange-500 h-full w-0 transition-all duration-150"></div>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3 pt-2">
        <button onclick="closeExportModal()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-700 transition">
          Cancel
        </button>
        <button onclick="renderAndDownloadVideo()" id="start-export-btn" class="flex-1 py-3 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-extrabold text-xs rounded-xl border-2 border-slate-950 btn-cartoon flex items-center justify-center gap-2">
          <i class="fa-solid fa-circle-play"></i> Start Rendering
        </button>
      </div>

    </div>
  </div>

  <script>
    // Cartoon Engine Global State
    const state = {
      isPlaying: false,
      currentTime: 0,
      duration: 12, // Calculated based on lines
      aspectRatio: '9:16',
      character: 'monster', // monster, cat, alien, kid
      characterMood: 'happy',
      scene: 'park', // park, space, candy, comic
      bubbleStyle: 'pop', // pop, cloud, box
      lines: [],
      currentLineIndex: 0,
      comicFX: null,
      comicFXTimer: 0
    };

    // Pre-made Cartoon Script Presets
    const SCRIPT_PRESETS = {
      banana: [
        "Why did the banana go to the doctor?",
        "Because it was NOT peeling very well!",
        "HA HA HA! Get it?!"
      ],
      alien: [
        "Greetings Earthling!",
        "I travelled 4 million lightyears...",
        "...just to ask for your Wi-Fi password!"
      ],
      homework: [
        "Teacher: Where is your homework?",
        "Me: My dog ate it!",
        "Teacher: You don't have a dog!",
        "Me: I bought one just for this!"
      ],
      laser: [
        "Target spotted: THE RED DOT!",
        "Initiating super cat pounce in 3... 2... 1...",
        "NOOO! IT ESCAPED AGAIN!"
      ]
    };

    // DOM Caching
    const canvas = document.getElementById('toon-canvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');
    const scriptInput = document.getElementById('script-input');
    const playIcon = document.getElementById('play-icon');
    const timeCode = document.getElementById('time-code');
    const activeLineCounter = document.getElementById('active-line-counter');

    // Audio Context Setup
    let audioCtx = null;
    let bgMusicNode = null;

    // Animation Loop Counters
    let animationFrameId = null;
    let lastTime = 0;
    let blinkTimer = 0;
    let isBlinking = false;

    // Window Init
    window.addEventListener('load', () => {
      setAspectRatio('9:16');
      loadPresetScript('banana');
      requestAnimationFrame(mainAnimationLoop);
    });

    // Handle Script Text Changes
    scriptInput.addEventListener('input', () => {
      parseScriptLines();
    });

    function parseScriptLines() {
      const text = scriptInput.value.trim();
      if (!text) {
        state.lines = [];
      } else {
        state.lines = text.split('\n').filter(line => line.trim().length > 0);
      }
      // Each line gets ~3 seconds
      state.duration = Math.max(state.lines.length * 3.2, 4);
      updateUIInfo();
    }

    function loadPresetScript(key) {
      if (SCRIPT_PRESETS[key]) {
        scriptInput.value = SCRIPT_PRESETS[key].join('\n');
        parseScriptLines();
      }
    }

    // Aspect Ratio Adjustments
    function setAspectRatio(ratio) {
      state.aspectRatio = ratio;
      const btn916 = document.getElementById('ratio-9-16');
      const btn169 = document.getElementById('ratio-16-9');

      if (ratio === '9:16') {
        btn916.className = "px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition";
        btn169.className = "px-2.5 py-1 text-xs font-bold rounded-lg hover:bg-slate-800 text-slate-400 transition";
      } else {
        btn169.className = "px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition";
        btn916.className = "px-2.5 py-1 text-xs font-bold rounded-lg hover:bg-slate-800 text-slate-400 transition";
      }

      resizeCanvasDimensions();
    }

    function resizeCanvasDimensions() {
      let w = 320;
      let h = 568;

      if (state.aspectRatio === '16:9') {
        w = 568;
        h = 320;
      }

      canvas.width = w * 2; // High DPI Retina
      canvas.height = h * 2;
      canvasWrapper.style.width = `${w}px`;
      canvasWrapper.style.height = `${h}px`;
    }

    function switchTab(tab) {
      ['script', 'character', 'scene', 'audio'].forEach(t => {
        const panel = document.getElementById(`panel-${t}`);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          panel.classList.remove('hidden');
          btn.className = 'flex-1 py-2 text-xs font-bold text-amber-400 bg-slate-900 rounded-lg border border-slate-800 transition';
        } else {
          panel.classList.add('hidden');
          btn.className = 'flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition';
        }
      });
    }

    function setBubbleStyle(style) {
      state.bubbleStyle = style;
      ['pop', 'cloud', 'box'].forEach(s => {
        const btn = document.getElementById(`bubble-style-${s}`);
        if (s === style) {
          btn.className = "py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl border border-slate-950 transition";
        } else {
          btn.className = "py-2 bg-slate-950 text-slate-400 hover:text-slate-200 font-bold text-xs rounded-xl border border-slate-800 transition";
        }
      });
    }

    function selectCharacter(char) {
      state.character = char;
      ['monster', 'cat', 'alien', 'kid'].forEach(c => {
        const btn = document.getElementById(`char-btn-${c}`);
        if (c === char) {
          btn.classList.add('border-amber-500');
          btn.classList.remove('border-slate-800');
        } else {
          btn.classList.remove('border-amber-500');
          btn.classList.add('border-slate-800');
        }
      });
    }

    function updateCharacterMood() {
      state.characterMood = document.getElementById('character-mood').value;
    }

    function setScene(sc) {
      state.scene = sc;
      ['park', 'space', 'candy', 'comic'].forEach(s => {
        const btn = document.getElementById(`scene-btn-${s}`);
        if (s === sc) {
          btn.classList.add('border-amber-500');
          btn.classList.remove('border-slate-800');
        } else {
          btn.classList.remove('border-amber-500');
          btn.classList.add('border-slate-800');
        }
      });
    }

    function drawSceneBackground() {
      const w = canvas.width;
      const h = canvas.height;

      if (state.scene === 'park') {
        // Sky Gradient
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#38bdf8');
        sky.addColorStop(1, '#bae6fd');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        // Sun
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(w * 0.8, h * 0.15, w * 0.12, 0, Math.PI * 2);
        ctx.fill();

        // Rolling Hills
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(w * 0.3, h * 1.1, w * 0.7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(w * 0.8, h * 1.15, w * 0.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (state.scene === 'space') {
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, w, h);

        // Stars
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 30; i++) {
          const sx = (Math.sin(i * 99) * 0.5 + 0.5) * w;
          const sy = (Math.cos(i * 33) * 0.5 + 0.5) * h;
          ctx.beginPath();
          ctx.arc(sx, sy, (i % 3) + 1, 0, Math.PI * 2);
          ctx.fill();
        }

        // Nebula
        const neb = ctx.createRadialGradient(w*0.5, h*0.4, 10, w*0.5, h*0.4, w*0.6);
        neb.addColorStop(0, 'rgba(168, 85, 247, 0.3)');
        neb.addColorStop(1, 'transparent');
        ctx.fillStyle = neb;
        ctx.fillRect(0, 0, w, h);
      } else if (state.scene === 'candy') {
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#f472b6');
        sky.addColorStop(1, '#fbcfe8');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);

        // Chocolate Ground
        ctx.fillStyle = '#78350f';
        ctx.beginPath();
        ctx.arc(w * 0.5, h * 1.2, w * 0.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (state.scene === 'comic') {
        ctx.fillStyle = '#facc15';
        ctx.fillRect(0, 0, w, h);

        // Sunburst Rays
        ctx.save();
        ctx.translate(w/2, h/2);
        ctx.fillStyle = '#ef4444';
        const numRays = 12;
        for (let i = 0; i < numRays; i++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, w * 1.2, (i * 2 * Math.PI) / numRays, ((i * 2 + 1) * Math.PI) / numRays);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // Animated Vector Character Drawing Engine
    function drawAnimatedCharacter(timestamp) {
      const w = canvas.width;
      const h = canvas.height;

      // Character Position
      const charX = w * 0.5;
      const charY = h * 0.65;

      // Bounce Physics
      let bounce = 0;
      if (state.isPlaying) {
        const freq = state.characterMood === 'silly' ? 12 : 6;
        bounce = Math.sin(timestamp * 0.008 * freq) * 12;
      }

      // Is speaking state check
      const isSpeaking = state.isPlaying && state.lines.length > 0;
      const mouthOpen = isSpeaking ? (Math.sin(timestamp * 0.02) > 0) : false;

      // Blink Logic
      blinkTimer += 1;
      if (blinkTimer > 180) {
        isBlinking = true;
        if (blinkTimer > 192) {
          isBlinking = false;
          blinkTimer = 0;
        }
      }

      ctx.save();
      ctx.translate(charX, charY + bounce);

      if (state.character === 'monster') {
        // Monster Body (Green)
        ctx.fillStyle = '#10b981';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.22, h * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Monster Horns
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(-w * 0.12, -h * 0.14);
        ctx.lineTo(-w * 0.18, -h * 0.24);
        ctx.lineTo(-w * 0.05, -h * 0.16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(w * 0.12, -h * 0.14);
        ctx.lineTo(w * 0.18, -h * 0.24);
        ctx.lineTo(w * 0.05, -h * 0.16);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Big Single Eye
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -h * 0.04, w * 0.08, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Pupil
        if (!isBlinking) {
          ctx.fillStyle = '#020617';
          ctx.beginPath();
          ctx.arc(0, -h * 0.04, w * 0.03, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.moveTo(-w * 0.05, -h * 0.04);
          ctx.lineTo(w * 0.05, -h * 0.04);
          ctx.stroke();
        }

        // Mouth
        ctx.fillStyle = '#020617';
        if (mouthOpen) {
          ctx.beginPath();
          ctx.arc(0, h * 0.06, w * 0.06, 0, Math.PI);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(0, h * 0.06, w * 0.05, 0.2, Math.PI - 0.2);
          ctx.stroke();
        }

      } else if (state.character === 'cat') {
        // Chester Cat (Orange)
        ctx.fillStyle = '#fb923c';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.arc(0, 0, w * 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ears
        ctx.beginPath();
        ctx.moveTo(-w * 0.15, -h * 0.1);
        ctx.lineTo(-w * 0.22, -h * 0.22);
        ctx.lineTo(-w * 0.05, -h * 0.15);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(w * 0.15, -h * 0.1);
        ctx.lineTo(w * 0.22, -h * 0.22);
        ctx.lineTo(w * 0.05, -h * 0.15);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#020617';
        if (!isBlinking) {
          ctx.beginPath();
          ctx.arc(-w * 0.08, -h * 0.02, w * 0.025, 0, Math.PI * 2);
          ctx.arc(w * 0.08, -h * 0.02, w * 0.025, 0, Math.PI * 2);
          ctx.fill();
        }

        // Whiskers
        ctx.beginPath();
        ctx.moveTo(-w * 0.1, h * 0.02);
        ctx.lineTo(-w * 0.22, 0);
        ctx.moveTo(w * 0.1, h * 0.02);
        ctx.lineTo(w * 0.22, 0);
        ctx.stroke();

        // Mouth
        if (mouthOpen) {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(0, h * 0.05, w * 0.04, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      } else if (state.character === 'alien') {
        // Alien Zog (Purple)
        ctx.fillStyle = '#a855f7';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.ellipse(0, 0, w * 0.18, h * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.arc(-w * 0.07, -h * 0.04, w * 0.04, 0, Math.PI * 2);
        ctx.arc(w * 0.07, -h * 0.04, w * 0.04, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Mouth
        ctx.fillStyle = '#020617';
        if (mouthOpen) {
          ctx.fillRect(-w * 0.04, h * 0.08, w * 0.08, h * 0.03);
        } else {
          ctx.beginPath();
          ctx.moveTo(-w * 0.04, h * 0.08);
          ctx.lineTo(w * 0.04, h * 0.08);
          ctx.stroke();
        }
      } else if (state.character === 'kid') {
        // Hero Kid
        ctx.fillStyle = '#fde047';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.arc(0, 0, w * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eyes
        ctx.fillStyle = '#020617';
        if (!isBlinking) {
          ctx.beginPath();
          ctx.arc(-w * 0.06, -h * 0.02, w * 0.02, 0, Math.PI * 2);
          ctx.arc(w * 0.06, -h * 0.02, w * 0.02, 0, Math.PI * 2);
          ctx.fill();
        }

        // Mouth
        if (mouthOpen) {
          ctx.beginPath();
          ctx.arc(0, h * 0.04, w * 0.05, 0, Math.PI);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function drawSpeechBubble() {
      if (state.lines.length === 0) return;

      const lineIndex = Math.min(
        Math.floor((state.currentTime / state.duration) * state.lines.length),
        state.lines.length - 1
      );

      state.currentLineIndex = lineIndex;
      const currentText = state.lines[lineIndex] || "";

      const w = canvas.width;
      const h = canvas.height;

      const bubbleX = w * 0.1;
      const bubbleY = h * 0.12;
      const bubbleW = w * 0.8;
      const bubbleH = h * 0.28;

      ctx.save();

      if (state.bubbleStyle === 'pop') {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#020617';
        ctx.lineWidth = 8;

        // Rounded Box Speech Bubble
        ctx.beginPath();
        ctx.roundRect(bubbleX, bubbleY, bubbleW, bubbleH, 24);
        ctx.fill();
        ctx.stroke();

        // Speech Tail Pointer
        ctx.beginPath();
        ctx.moveTo(w * 0.45, bubbleY + bubbleH);
        ctx.lineTo(w * 0.5, bubbleY + bubbleH + 30);
        ctx.lineTo(w * 0.55, bubbleY + bubbleH);
        ctx.fill();
        ctx.stroke();

        // Text
        ctx.fillStyle = '#020617';
        ctx.font = `700 ${w * 0.055}px "Fredoka", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        wrapText(ctx, currentText, w * 0.5, bubbleY + bubbleH / 2, bubbleW - 40, w * 0.07);

      } else if (state.bubbleStyle === 'cloud') {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 8;

        ctx.beginPath();
        ctx.arc(w * 0.3, bubbleY + 60, 50, 0, Math.PI * 2);
        ctx.arc(w * 0.5, bubbleY + 40, 70, 0, Math.PI * 2);
        ctx.arc(w * 0.7, bubbleY + 60, 50, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#020617';
        ctx.font = `700 ${w * 0.05}px "Comic Neue", cursive`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        wrapText(ctx, currentText, w * 0.5, bubbleY + 50, bubbleW - 60, w * 0.06);

      } else if (state.bubbleStyle === 'box') {
        ctx.fillStyle = '#020617';
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 8;

        ctx.fillRect(bubbleX, bubbleY, bubbleW, bubbleH);
        ctx.strokeRect(bubbleX, bubbleY, bubbleW, bubbleH);

        ctx.fillStyle = '#facc15';
        ctx.font = `900 ${w * 0.06}px "Bangers", cursive`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        wrapText(ctx, currentText, w * 0.5, bubbleY + bubbleH / 2, bubbleW - 40, w * 0.08);
      }

      ctx.restore();
    }

    // Helper text wrapping function for canvas
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let lines = [];

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      let startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (let k = 0; k < lines.length; k++) {
        context.fillText(lines[k].trim(), x, startY + k * lineHeight);
      }
    }

    function drawComicFXOverlay() {
      if (!state.comicFX) return;

      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      ctx.translate(w * 0.5, h * 0.35);
      ctx.rotate(-0.1);

      ctx.fillStyle = '#ef4444';
      ctx.font = `900 ${w * 0.15}px "Bangers", cursive`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 12;

      ctx.strokeText(state.comicFX, 0, 0);
      ctx.fillText(state.comicFX, 0, 0);

      ctx.restore();
    }

    function triggerComicEffect(text) {
      state.comicFX = text;
      playSFX('boing');
      setTimeout(() => { state.comicFX = null; }, 1200);
    }

    // Main Animation Loop Engine
    function mainAnimationLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = (timestamp - lastTime) / 1000;

      if (state.isPlaying) {
        state.currentTime += delta;
        if (state.currentTime >= state.duration) {
          state.currentTime = 0;
        }
        updateUIInfo();
      }

      lastTime = timestamp;

      // Render Stage Stack
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSceneBackground();
      drawAnimatedCharacter(timestamp);
      drawSpeechBubble();
      drawComicFXOverlay();

      animationFrameId = requestAnimationFrame(mainAnimationLoop);
    }

    function togglePlayPause() {
      state.isPlaying = !state.isPlaying;
      playIcon.className = state.isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";

      if (state.isPlaying) {
        startAudioSynth();
      } else {
        stopAudioSynth();
      }
    }

    function resetPlayback() {
      state.isPlaying = false;
      state.currentTime = 0;
      playIcon.className = "fa-solid fa-play";
      stopAudioSynth();
      updateUIInfo();
    }

    function updateUIInfo() {
      const curM = Math.floor(state.currentTime / 60).toString().padStart(2, '0');
      const curS = Math.floor(state.currentTime % 60).toString().padStart(2, '0');
      const durM = Math.floor(state.duration / 60).toString().padStart(2, '0');
      const durS = Math.floor(state.duration % 60).toString().padStart(2, '0');

      timeCode.innerText = `${curM}:${curS} / ${durM}:${durS}`;
      activeLineCounter.innerText = `Line ${state.currentLineIndex + 1} of ${state.lines.length || 1}`;
    }

    // Playful Web Audio Synthesizer Engine
    function startAudioSynth() {
      const theme = document.getElementById('audio-theme').value;
      if (theme === 'none') return;

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(261.63, audioCtx.currentTime); // C4

      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();

      bgMusicNode = osc;
    }

    function stopAudioSynth() {
      if (bgMusicNode) {
        try {
          bgMusicNode.stop();
          bgMusicNode.disconnect();
        } catch(e) {}
        bgMusicNode = null;
      }
    }

    function playSFX(type) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (type === 'boing') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
      } else if (type === 'pop') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
      } else if (type === 'laugh') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      } else if (type === 'whistle') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
      }

      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function openExportModal() {
      document.getElementById('export-modal').classList.remove('hidden');
      document.getElementById('export-modal').classList.add('flex');
    }

    function closeExportModal() {
      document.getElementById('export-modal').classList.add('hidden');
      document.getElementById('export-modal').classList.remove('flex');
    }

    function renderAndDownloadVideo() {
      const statusText = document.getElementById('export-status-text');
      const progressBar = document.getElementById('export-progress-bar');
      const percentageText = document.getElementById('export-percentage');
      const progressBox = document.getElementById('export-progress-box');
      const startBtn = document.getElementById('start-export-btn');

      progressBox.classList.remove('hidden');
      startBtn.disabled = true;
      startBtn.classList.add('opacity-50');

      // Native Canvas Capture Stream
      const stream = canvas.captureStream(30);
      let recorder;
      
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch(e) {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      }

      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        // Auto-download video
        const a = document.createElement('a');
        a.href = url;
        a.download = `vee-toon-video-${Date.now()}.webm`;
        a.click();

        statusText.innerText = "Export Complete! Downloading...";
        setTimeout(() => {
          closeExportModal();
          startBtn.disabled = false;
          startBtn.classList.remove('opacity-50');
          progressBox.classList.add('hidden');
        }, 1500);
      };

      // Reset & Play for Recording
      state.currentTime = 0;
      state.isPlaying = true;
      recorder.start();

      const renderInterval = setInterval(() => {
        const pct = Math.floor((state.currentTime / state.duration) * 100);
        progressBar.style.width = `${pct}%`;
        percentageText.innerText = `${pct}%`;

        if (state.currentTime >= state.duration) {
          clearInterval(renderInterval);
          recorder.stop();
          state.isPlaying = false;
        }
      }, 100);
    }
  </script>
